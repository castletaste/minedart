name: minedart
description: "A finite Minecraft Classic-style showcase built with Flutter and flame_3d."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.0
  flame_3d: ^0.3.0
  minedart_core:
    path: ../packages/core
  vector_math: ^2.1.4
  image: ^4.8.0
  path_provider: ^2.1.5
  web: ^1.1.1
  audioplayers: ^6.8.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/shaders/
    - assets/textures/
    - assets/audio/
