name: minedart
description: "A finite Minecraft Classic-style showcase built with Flutter and flame_3d."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.0
  flame_3d:
    path: ../third_party/flame_3d
  # Experimental second renderer, compiled in with
  # --dart-define=MINEDART_RENDERER=flutter_scene. Pinned exactly: minor
  # releases still break geometry and material APIs.
  flutter_scene: 0.24.3
  hooks: ^2.0.0
  minedart_core:
    path: ../packages/core
  vector_math: ^2.1.4
  image: ^4.8.0
  path_provider: ^2.1.5
  web: ^1.1.1
  audioplayers: ^6.8.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/shaders/
    - assets/textures/
    - assets/audio/
    # flutter_scene renderer: .fmat materials compiled by hook/build.dart.
    # Bundled in every build; only MINEDART_RENDERER=flutter_scene loads them.
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms: [ios]
    - path: flutter_scene_generated/metal_desktop/
      platforms: [macos]
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms: [android, linux, windows]
    - path: flutter_scene_generated/opengl_es/
      platforms: [web]
