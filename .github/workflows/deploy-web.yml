name: Verify and deploy Minedart web

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions: {}

concurrency:
  group: minedart-${{ github.event_name == 'pull_request' && github.ref || 'cloudflare-pages-production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter 3.44.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: false
          pub-cache: false

      - name: Report toolchain
        run: |
          flutter --version
          dart --version

      - name: Test preview artifact policy
        run: node --test .github/scripts/*.test.cjs

      - name: Resolve core dependencies
        working-directory: packages/core
        run: dart pub get

      - name: Analyze core
        working-directory: packages/core
        run: dart analyze

      - name: Check core formatting
        working-directory: packages/core
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Test core
        working-directory: packages/core
        run: dart test

      - name: Resolve vendored flame_3d dependencies
        working-directory: third_party/flame_3d
        run: flutter pub get

      - name: Analyze vendored flame_3d
        working-directory: third_party/flame_3d
        run: flutter analyze

      - name: Test vendored flame_3d on VM
        working-directory: third_party/flame_3d
        run: flutter test

      - name: Test focused vendored flame_3d cache suite in Chrome
        working-directory: third_party/flame_3d
        run: flutter test --platform chrome test/graphics/backend/web_gpu/cache_policy_chrome_test.dart

      - name: Compile focused vendored flame_3d cache-off arm in Chrome
        working-directory: third_party/flame_3d
        run: flutter test --platform chrome --dart-define=FLAME_3D_WEBGPU_BIND_CACHE=false test/graphics/backend/web_gpu/cache_policy_define_off_chrome_test.dart

      - name: Resolve locked app dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Analyze app
        working-directory: app
        run: flutter analyze

      - name: Check app formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Test app
        working-directory: app
        run: flutter test

      - name: Test browser input and bounded decompression
        working-directory: app
        run: flutter test --platform chrome test/input/browser_pointer_lock_web_test.dart test/data/worlds/gzip_codec_test.dart

      - name: Build and verify Wasm release
        working-directory: app
        run: bash tool/build_web_release.sh

      - name: Upload verified web bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minedart-web-${{ github.sha }}
          path: app/build/web
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  deploy:
    name: Deploy verified bundle
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://minedart.castletaste.dev
    permissions:
      actions: read
      contents: read
      deployments: write

    steps:
      - name: Check out trusted deployment tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false

      - name: Download verified web bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: minedart-web-${{ github.sha }}
          path: app/build/web
          digest-mismatch: error

      - name: Install pinned Wrangler without deployment credentials
        working-directory: trusted-source/.github/preview-tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "if (require('./node_modules/wrangler/package.json').version !== '4.125.0') process.exit(1)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          NPM_CONFIG_OFFLINE: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: trusted-source/.github/preview-tools
          wranglerVersion: 4.125.0
          command: >-
            pages deploy ${{ github.workspace }}/app/build/web
            --project-name=castletaste-minedart
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=false
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
