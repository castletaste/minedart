name: Deploy Minedart web

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: minedart-cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Wasm release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://minedart.castletaste.dev
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true
          pub-cache: true

      - name: Resolve vendored flame_3d dependencies
        working-directory: third_party/flame_3d
        run: flutter pub get

      - name: Analyze vendored flame_3d
        working-directory: third_party/flame_3d
        run: flutter analyze

      - name: Test vendored flame_3d on VM
        working-directory: third_party/flame_3d
        run: flutter test

      - name: Test focused vendored flame_3d cache suite in Chrome
        working-directory: third_party/flame_3d
        run: flutter test --platform chrome test/graphics/backend/web_gpu/cache_policy_chrome_test.dart

      - name: Compile focused vendored flame_3d cache-off arm in Chrome
        working-directory: third_party/flame_3d
        run: flutter test --platform chrome --dart-define=FLAME_3D_WEBGPU_BIND_CACHE=false test/graphics/backend/web_gpu/cache_policy_define_off_chrome_test.dart

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build and verify Wasm release
        run: bash tool/build_web_release.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/build/web --project-name=castletaste-minedart --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
